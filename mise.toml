[tools]
    rust = "1.97.1"

[tasks."kc:install"]
    run = "cargo install --path kc-cli --features trust-apps --force"

[tasks."apwh:install"]
    run = "cargo install --path apwh --bin apwh"

[tasks.verify]
description = "Run the complete local release gate"
run = """
cargo fmt --all -- --check
cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
CARGO_TARGET_DIR="$PWD/target" cargo build -p apwh --example fake_helper --all-features --locked
cargo test --workspace --all-targets --all-features --locked
cargo test --workspace --doc --all-features --locked
RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
cargo build --workspace --release --all-features --locked
cargo package -p keychain-db --allow-dirty
"""

[tasks."kc-cli:package"]
description = "Package kc-cli after publishing its keychain-db dependency"
run = "cargo package -p kc-cli --allow-dirty"
